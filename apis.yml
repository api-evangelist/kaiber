name: Kaiber
description: 'Kaiber (Kyber Corp., dba Kaiber) is an AI creative studio for generative
  video and audio. Its web and mobile apps let creators turn text prompts, images,
  and music into stylized videos through features such as Canvas, Beat Sync, Auto-Clip,
  and an Editor timeline, sold via credit-based monthly subscription plans (Starter,
  Creator, Pro, Visionary) plus day passes and one-time credit packs. Kaiber does
  not currently publish a public developer API; this profile tracks the company''s
  identity and public web properties in the API Evangelist network, surfaced originally
  as a portfolio company of eqt-ventures.'
